name: Build Binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Test
        run: go test ./...

      - name: Build binary
        id: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${GITHUB_SHA::12}"
          BIN="ima-mcp-server-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            BIN="${BIN}.exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${BIN}" ./cmd/ima-mcp-server
          echo "binary=${BIN}" >> "${GITHUB_OUTPUT}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ima-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ steps.build.outputs.binary }}
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ima-mcp-server-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ima-mcp-server-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 30
